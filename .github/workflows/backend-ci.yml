name: Backend CI

on:
  pull_request:
    paths: ["Backend/**", ".github/workflows/backend-ci.yml"]
  push:
    branches: [main]
    paths: ["Backend/**"]

defaults:
  run:
    working-directory: Backend

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smartsweep
          POSTGRES_PASSWORD: smartsweep
          POSTGRES_DB: smartsweep_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Set up Python 3.13
        run: uv python install 3.13
      # Steps below are stubbed until dependencies are pinned in pyproject.toml.
      # - run: uv sync
      # - run: uv run ruff check .
      # - run: uv run black --check .
      # - run: uv run alembic upgrade head
      # - run: uv run pytest --cov=app
