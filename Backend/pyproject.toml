[project]
name = "smartsweep-backend"
version = "0.0.0"
description = "SmartSweep civic waste-management backend (FastAPI)."
requires-python = ">=3.13"

# Dependencies are intentionally stubbed for the scaffold phase and will be
# pinned as each layer is implemented. Intended runtime stack:
dependencies = [
    # "fastapi",
    # "uvicorn[standard]",
    # "sqlalchemy>=2.0",
    # "psycopg[binary]",
    # "alembic",
    # "pydantic",
    # "pydantic-settings",
    # "python-jose[cryptography]",
    # "passlib[bcrypt]",
]

[dependency-groups]
dev = [
    # "pytest",
    # "pytest-cov",
    # "httpx",
    # "ruff",
    # "black",
    # "pre-commit",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
