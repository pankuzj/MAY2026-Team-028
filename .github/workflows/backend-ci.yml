name: Backend CI

on:
  pull_request:
    paths: ["Backend/**", "docs/**", ".github/workflows/backend-ci.yml", ".spectral.yaml"]
  push:
    branches: [main]
    paths: ["Backend/**", "docs/**"]

defaults:
  run:
    working-directory: Backend

jobs:
  quality:
    runs-on: ubuntu-latest
    # NOTE: no postgres service and no `alembic upgrade head` step here.
    # alembic.ini is still a placeholder (`TODO: initialise with
    # `alembic init app/db/migrations``) — there's no env.py or versions/
    # folder yet, so there's nothing for alembic to run against. Tables are
    # created via Base.metadata.create_all() in app/db/init_db.py instead,
    # and the test suite runs entirely against in-memory SQLite (see
    # tests/conftest.py), so neither is needed for this job to be meaningful.
    # Re-add both once alembic is actually initialized and a real migration
    # exists to run.
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Set up Python 3.13
        run: uv python install 3.13
      - name: Install dependencies
        run: uv sync --group dev
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format check (black)
        run: uv run black --check .
      - name: Test (pytest + coverage)
        run: uv run pytest --cov=app --cov-report=term-missing --cov-report=xml

  openapi-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run Spectral OpenAPI Linter
        run: npx -y @stoplight/spectral-cli lint docs/sprint-1/openapi.yaml --ruleset .spectral.yaml

