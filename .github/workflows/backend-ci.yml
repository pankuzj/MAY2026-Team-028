name: Backend CI

on:
  pull_request:
    paths: ["Backend/**", ".github/workflows/backend-ci.yml"]
  push:
    branches: [main]
    paths: ["Backend/**"]

defaults:
  run:
    working-directory: Backend

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smartsweep
          POSTGRES_PASSWORD: smartsweep
          POSTGRES_DB: smartsweep_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Points at the postgres service container above. Only alembic needs a
      # real database here — the pytest suite runs against in-memory SQLite
      # per tests/conftest.py, so it works even without this being set.
      DATABASE_URL: postgresql+psycopg://smartsweep:smartsweep@localhost:5432/smartsweep_test
      JWT_SECRET_KEY: ci-test-secret-not-for-prod
      ENV: test
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Set up Python 3.13
        run: uv python install 3.13
      - name: Install dependencies
        run: uv sync --group dev
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format check (black)
        run: uv run black --check .
      - name: Run migrations
        run: uv run alembic upgrade head
      - name: Test (pytest + coverage)
        run: uv run pytest --cov=app --cov-report=term-missing --cov-report=xml
